<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authentication Gateway // Stackly Systems</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-portal-body">

    <section class="login-portal-section">
        <div class="portal-grid-backdrop"></div>

        <div class="portal-split-container">
            
            <!-- Left Side Vector Column -->
            <div class="portal-left-visual">
                <div class="vector-hud-scope">
                    <svg class="hud-matrix-svg" viewBox="0 0 220 220" xmlns="http://w3.org">
                        <defs>
                            <linearGradient id="beamGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="rgba(0, 240, 255, 0.18)" stop-opacity="1"/>
                                <stop offset="60%" stop-color="rgba(157, 78, 221, 0.03)" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        <circle cx="110" cy="110" r="95" fill="none" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1" />
                        <circle cx="110" cy="110" r="70" fill="none" stroke="#9d4edd" stroke-width="1" stroke-dasharray="6, 4" class="radar-inner-ring" />
                        <circle cx="110" cy="110" r="45" fill="none" stroke="#00f0ff" stroke-width="1.5" />
                        <circle cx="110" cy="110" r="6" fill="#ffffff" />
                        
                        <g class="satellite-orbit-group">
                            <ellipse cx="110" cy="110" rx="80" ry="25" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" transform="rotate(-30 110 110)" />
                            <circle cx="40" cy="70" r="4.5" fill="#00f0ff" class="radar-ping-dot" />
                            <circle cx="180" cy="150" r="4.5" fill="#9d4edd" class="radar-ping-dot" />
                        </g>
                        <path d="M110,110 L220,110 A110,110 0 0,1 110,220 Z" fill="url(#beamGlow)" class="radar-sweep-beam-path"/>
                    </svg>
                    <div class="hud-telemetry-chip chip-top">AUTHENTICATION // CORE</div>
                    <div class="hud-telemetry-chip chip-bottom">GATEWAY_STATUS // LOCKED</div>
                </div>
            </div>

            <!-- Right Side Login Card -->
            <div class="portal-right-card-panel">
                <div class="secure-auth-card">
                    
                    <div class="card-top-nav-row">
                        <a href="index.html" class="home-nav-pill">← Home</a>
                    </div>

                    <h1 class="portal-main-title">WELCOME BACK</h1>
                    <p class="portal-subtitle">Select your operational role to sign in to your project dashboard.</p>

                    <form id="secureLoginForm" novalidate>
                        
                        <span class="field-console-label">SELECT ROLE</span>
                        <div class="role-selector-row">
                            <div class="role-select-box active-role" id="roleBtnPartner" data-role="partner">
                                <div class="role-icon-circle bg-cyan">
                                    <svg viewBox="0 0 24 24" class="role-svg"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                                </div>
                                <span class="role-title">Studio Partner</span>
                            </div>

                            <div class="role-select-box" id="roleBtnClient" data-role="client">
                                <div class="role-icon-circle bg-dim">
                                    <svg viewBox="0 0 24 24" class="role-svg"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="16"></line><line x1="15" y1="22" x2="15" y2="16"></line><line x1="9" y1="16" x2="15" y2="16"></line></svg>
                                </div>
                                <span class="role-title">Corporate Client</span>
                            </div>
                        </div>

                        <div class="console-input-group">
                            <label for="inputEmail">EMAIL ADDRESS</label>
                            <input type="email" id="inputEmail" class="portal-console-input" placeholder="name@company.com" autocomplete="off">
                        </div>

                        <div class="console-input-group">
                            <label for="inputPassword">PASSWORD</label>
                            <div class="password-field-wrapper">
                                <input type="password" id="inputPassword" class="portal-console-input" placeholder="Enter security key" autocomplete="off">
                                <button type="button" class="password-toggle-peek" id="passwordVisToggle" aria-label="Toggle visibility">
                                    <svg viewBox="0 0 24 24" class="peek-svg"><path d="M1 12s4-8 11-8 4 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>

                        <div class="forgot-link-row">
                            <a href="404.html" class="forgot-password-anchor">Forgot Password?</a>
                        </div>

                        <button type="submit" class="secure-login-submit-btn">
                            <span>LOG IN SECURELY →</span>
                        </button>

                        <div class="social-divider-row">
                            <span class="divider-line-label">OR SIGN IN WITH</span>
                        </div>

                        <div class="social-auth-grid">
                            <a href="404.html" class="social-federated-btn">
                                <svg viewBox="0 0 24 24" class="white-vector-icon"><path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 3.94 1.025 4.882 1.93l2.454-2.357C17.846 2.45 15.223 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.988 0-.746-.08-1.32-.176-1.892H12.24z"/></svg>
                                <span>Google</span>
                            </a>
                            <a href="404.html" class="social-federated-btn">
                                <svg viewBox="0 0 24 24" class="white-vector-icon"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                                <span>Facebook</span>
                            </a>
                        </div>

                        <div class="portal-form-footer">
                            <span>Don't have an account? <a href="signup.html" class="signup-redirect-anchor">Create Account</a></span>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </section>

  <style>
    /* ==========================================
   RESET MARGINS & FORCE 100% CANVAS BOUNDS
========================================== */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background-color: #060913;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
}

.fullscreen-portal-body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
}

:root {
    --bg-deep: #060913;
    --bg-surface: #0a0f1d;
    --neon-cyan: #00f0ff;
    --neon-purple: #9d4edd;
    --text-bright: #ffffff;
    --text-dim: #55657e;
    --accent-error: #ff3366;
}

/* ==========================================
   PROPORTIONAL FULL VIEWPORT SPLIT PANEL
========================================== */
.login-portal-section {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0;
}

.portal-grid-backdrop {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.005) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none; z-index: 1;
}

.portal-split-container {
    position: relative;
    width: 100%;
    max-width: 1340px;
    margin: 0 auto;
    padding: 0 40px;
    display: grid;
    grid-template-columns: 0.95fr 1.05fr;
    gap: 60px;
    align-items: center;
    z-index: 2;
}

/* ==========================================
   LEFT ZONE - CONTINUOUS MONITORING SONAR
========================================== */
.portal-left-visual {
    width: 100%; display: flex; justify-content: center; align-items: center;
}

.vector-hud-scope {
    position: relative; width: 100%; max-width: 380px;
    aspect-ratio: 1 / 1; background: rgba(13, 21, 39, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.02); border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
}

.hud-matrix-svg { width: 100%; height: auto; display: block; }
.radar-sweep-beam-path { transform-origin: 110px 110px; animation: loopSweep 4s linear infinite; }
.radar-inner-ring { transform-origin: 110px 110px; animation: loopSweep 16s linear infinite reverse; }
.radar-ping-dot { animation: pulseDot 1.5s infinite ease-in-out; transform-origin: center; }

.hud-telemetry-chip {
    position: absolute; font-family: monospace; font-size: 0.65rem; color: white;
    letter-spacing: 1px; background-color: var(--bg-deep); padding: 2px 8px;
    border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 4px;
}
.chip-top { top: -6px; } .chip-bottom { bottom: -6px; }

/* ==========================================
   RIGHT ZONE - SECURE AUTH CONSOLE CARD
========================================== */
.portal-right-card-panel {
    width: 100%; display: flex; justify-content: flex-end;
}

.secure-auth-card {
    width: 100%; max-width: 500px;
    background-color: var(--bg-surface);
    border: 1px solid rgba(255, 255, 255, 0.02);
    border-radius: 16px; padding: 40px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    box-sizing: border-box;
}

.card-top-nav-row {
    width: 100%; display: flex; justify-content: flex-end; margin-bottom: 20px;
}

.home-nav-pill {
    padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700;
    text-decoration: none; color: #03060c; background-color: var(--text-bright);
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    transition: transform 0.2s, box-shadow 0.2s;
}
.home-nav-pill:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25); }

.portal-main-title {
    font-size: 2.5rem; font-weight: 900; color: var(--text-bright);
    letter-spacing: -0.5px; margin: 0 0 10px 0; text-align: left;
}

.portal-subtitle {
    font-size: 1.05rem; color: #55657e; line-height: 1.5; text-align: left; margin: 0 0 35px 0;
}

.field-console-label {
    display: block; font-family: monospace; font-size: 0.75rem; font-weight: 700;
    color:white; letter-spacing: 1.5px; text-align: left; margin-bottom: 14px;
}

.role-selector-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; margin-bottom: 30px;
}

.role-select-box {
    background-color: rgba(6, 9, 19, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 10px; padding: 22px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    cursor: pointer; box-sizing: border-box;
    transition: border-color 0.3s, background-color 0.3s, box-shadow 0.3s;
}

.role-icon-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
.role-icon-circle.bg-cyan { background-color: #1a2f4c; border: 1px solid rgba(0, 240, 255, 0.2); }
.role-icon-circle.bg-dim { background-color: rgba(6, 9, 19, 0.6); border: 1px solid rgba(255, 255, 255, 0.04); }

.role-svg { width: 14px; height: 14px; fill: none; stroke: white; stroke-width: 2.5; }
.role-select-box.active-role .role-svg { stroke: var(--neon-cyan); filter: drop-shadow(0 0 4px var(--neon-cyan)); }

.role-title { font-size: 0.95rem; font-weight: 700; color: white; transition: color 0.3s; }
.role-select-box.active-role .role-title { color: var(--text-bright); }

.role-select-box.active-role {
    border-color: rgba(0, 240, 255, 0.35);
    background-color: rgba(13, 21, 39, 0.35);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
}

.console-input-group {
    display: flex; flex-direction: column; align-items: flex-start; width: 100%; margin-bottom: 24px;
}
.console-input-group label {
    font-family: monospace; font-size: 0.75rem; font-weight: 700; color: white; letter-spacing: 1.5px; margin-bottom: 10px;
}

.portal-console-input {
    width: 100%; padding: 15px 18px;
    background-color: rgba(6, 9, 19, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px;
    color: var(--text-bright); font-size: 1.05rem; box-sizing: border-box;
    transition: border-color 0.25s, box-shadow 0.25s;
}
.portal-console-input:focus { outline: none; border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 8px rgba(0, 240, 255, 0.15); }

/* ==========================================
   PASSWORD POSITION EYE FIXED WRAPPER
========================================== */
.password-field-wrapper { 
    width: 100%; 
    position: relative; 
    display: block;
}
.password-field-wrapper .portal-console-input { 
    padding-right: 54px !important; 
}

.password-toggle-peek {
    position: absolute; 
    right: 16px; 
    top: 50%; 
    transform: translateY(-50%);
    background: none !important; 
    border: none !important; 
    cursor: pointer; 
    padding: 4px !important; 
    margin: 0 !important;
    display: inline-flex; 
    align-items: center;
    z-index: 5;
}
.peek-svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2.2; transition: stroke 0.2s; pointer-events: none; }
.password-toggle-peek:hover .peek-svg { stroke: var(--text-bright); filter: drop-shadow(0 0 4px var(--neon-cyan)); }
.password-toggle-peek.revealing-peek .peek-svg { stroke: var(--neon-cyan); filter: drop-shadow(0 0 6px var(--neon-cyan)); }

/* ===== LOGIN PAGE - PASSWORD EYE ICON AT INPUT END ===== */

.password-field-wrapper {
    position: relative;
    width: 100%;
}

.password-field-wrapper #inputPassword {
    width: 100%;
    padding-right: 55px;
    box-sizing: border-box;
}

.password-toggle-peek {
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);

    width: 30px;
    height: 30px;

    padding: 0;
    margin: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 10;
}

.peek-svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: white;
    stroke-width: 2.2;
    transition: stroke 0.2s, filter 0.2s;
    pointer-events: none;
}

.password-toggle-peek:hover .peek-svg {
    stroke: var(--text-bright);
    filter: drop-shadow(0 0 4px var(--neon-cyan));
}

.password-toggle-peek.revealing-peek .peek-svg {
    stroke: var(--neon-cyan);
    filter: drop-shadow(0 0 6px var(--neon-cyan));
}
.forgot-link-row { width: 100%; display: flex; justify-content: flex-end; margin-top: -10px; margin-bottom: 30px; }
.forgot-password-anchor { font-size: 0.9rem; color: #55657e; text-decoration: none; transition: color 0.2s; }
.forgot-password-anchor:hover { color: var(--text-bright); }

.secure-login-submit-btn {
    width: 100%; padding: 15px; border-radius: 25px; border: none;
    background: linear-gradient(90deg, #1fa2ff, #12c2e9, #00f0ff);
    color: #03060c; font-size: 0.95rem; font-weight: 800; letter-spacing: 0.5px;
    cursor: pointer; box-shadow: 0 6px 25px rgba(0, 240, 255, 0.35);
    transition: transform 0.2s, box-shadow 0.3s;
}
.secure-login-submit-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0, 240, 255, 0.5); }

.social-divider-row {
    width: 100%; display: flex; justify-content: center; align-items: center; position: relative; margin: 30px 0 20px 0;
}
.social-divider-row::before { content: ''; position: absolute; left: 0; width: 100%; height: 1px; background-color: rgba(255, 255, 255, 0.03); z-index: 1; }
.divider-line-label { font-family: monospace; font-size: 0.65rem; font-weight: 700; color:white ; background-color: var(--bg-surface); padding: 0 12px; z-index: 2; letter-spacing: 1px; }

.social-auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; margin-bottom: 35px; }

.social-federated-btn {
    background-color: rgba(6, 9, 19, 0.2); border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 20px; padding: 12px; display: flex; justify-content: center; align-items: center; gap: 10px;
    text-decoration: none; box-sizing: border-box; transition: background-color 0.25s, border-color 0.25s;
}
.social-federated-btn span { font-size: 0.9rem; font-weight: 700; color: #55657e; transition: color 0.25s; }

.white-vector-icon { width: 15px; height: 14px; flex-shrink: 0; fill: #55657e; transition: fill 0.25s ease; }

.social-federated-btn:hover { background-color: rgba(13, 21, 39, 0.5); border-color: rgba(255, 255, 255, 0.06); }
.social-federated-btn:hover span { color: var(--text-bright); }
.social-federated-btn:hover .white-vector-icon { fill: var(--text-bright); }

.portal-form-footer { width: 100%; text-align: center; }
.portal-form-footer span { font-size: 0.9rem; color: #55657e; }

.signup-redirect-anchor:hover { text-decoration: underline; color: var(--neon-cyan); }.input-alert-flash { animation: perimeterErrorFlash 0.3s ease infinite alternate; }@keyframes loopSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }@keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }@keyframes perimeterErrorFlash { 0% { box-shadow: 0 0 4px rgba(255, 51, 102, 0.2); border-color: rgba(255, 51, 102, 0.4); } 100% { box-shadow: 0 0 10px rgba(255, 51, 102, 0.6); border-color: var(--accent-error); } }/* ==========================================FLUID RESPONSIVE VIEWPORT CONSTRAINTS========================================== */@media (max-width: 992px) {.portal-split-container { grid-template-columns: 1fr; gap: 40px; padding: 0 24px; }.portal-left-visual { display: none; }.portal-right-card-panel { justify-content: center; }.secure-auth-card { max-width: 100%; }}@media (max-width: 480px) {.portal-split-container { padding: 0 16px; }.secure-auth-card { padding: 30px 16px; }.portal-main-title { font-size: 1.85rem; }.role-selector-row, .social-auth-grid { grid-template-columns: 1fr; gap: 12px; }.role-select-box { padding: 16px; flex-direction: row; justify-content: flex-start; gap: 16px; }.secure-login-submit-btn { border-radius: 8px; }}
  
  </style>


<script>
document.addEventListener("DOMContentLoaded", () => {

    /* =========================================================
       CORE LOGIN ELEMENTS
    ========================================================= */

    const loginForm =
        document.getElementById("secureLoginForm");

    const emailInput =
        document.getElementById("inputEmail");

    const passwordInput =
        document.getElementById("inputPassword");

    const passwordVisToggle =
        document.getElementById("passwordVisToggle");

    const roleBtnPartner =
        document.getElementById("roleBtnPartner");

    const roleBtnClient =
        document.getElementById("roleBtnClient");


    /* =========================================================
       DEFAULT ROLE
    ========================================================= */

    let activeSelectedRole = "partner";


    /* =========================================================
       ROLE SELECTION
    ========================================================= */

    function toggleActiveRoleProfile(
        activeBox,
        quietBox,
        rolePayloadStr
    ) {

        activeSelectedRole = rolePayloadStr;

        if (activeBox) {
            activeBox.classList.add("active-role");
        }

        if (quietBox) {
            quietBox.classList.remove("active-role");
        }
    }


    if (roleBtnPartner && roleBtnClient) {

        roleBtnPartner.addEventListener("click", () => {

            toggleActiveRoleProfile(
                roleBtnPartner,
                roleBtnClient,
                "partner"
            );

        });


        roleBtnClient.addEventListener("click", () => {

            toggleActiveRoleProfile(
                roleBtnClient,
                roleBtnPartner,
                "client"
            );

        });

    }


    /* =========================================================
       PASSWORD VISIBILITY TOGGLE
    ========================================================= */

    if (passwordVisToggle && passwordInput) {

        passwordVisToggle.addEventListener(
            "click",
            (event) => {

                event.preventDefault();

                const currentFieldType =
                    passwordInput.getAttribute("type");


                if (currentFieldType === "password") {

                    passwordInput.setAttribute(
                        "type",
                        "text"
                    );

                    passwordVisToggle.classList.add(
                        "revealing-peek"
                    );

                } else {

                    passwordInput.setAttribute(
                        "type",
                        "password"
                    );

                    passwordVisToggle.classList.remove(
                        "revealing-peek"
                    );

                }

            }
        );

    }


    /* =========================================================
       LOGIN FORM SUBMIT
    ========================================================= */

    if (loginForm) {

        loginForm.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();


                /* ---------------------------------------------
                   GET USER INPUT
                --------------------------------------------- */

                const emailValue =
                    emailInput
                        ? emailInput.value.trim()
                        : "";

                const passwordValue =
                    passwordInput
                        ? passwordInput.value.trim()
                        : "";


                let inputsAreValidFlag = true;


                /* ---------------------------------------------
                   EMAIL VALIDATION
                --------------------------------------------- */

                if (!emailValue) {

                    inputsAreValidFlag = false;

                    if (emailInput) {

                        emailInput.style.borderColor =
                            "var(--accent-error)";

                        emailInput.classList.add(
                            "input-alert-flash"
                        );

                    }

                }


                /* ---------------------------------------------
                   PASSWORD VALIDATION
                --------------------------------------------- */

                if (!passwordValue) {

                    inputsAreValidFlag = false;

                    if (passwordInput) {

                        passwordInput.style.borderColor =
                            "var(--accent-error)";

                        passwordInput.classList.add(
                            "input-alert-flash"
                        );

                    }

                }


                /* ---------------------------------------------
                   STOP IF VALIDATION FAILS
                --------------------------------------------- */

                if (!inputsAreValidFlag) {

                    alert(
                        "ACCESS DENIED: Please fill the required fields before submitting authentication payloads."
                    );

                    return;
                }


                /* =================================================
                   ⭐ SAVE LOGIN EMAIL
                   
                   Example:
                   test@gmail.com
                   
                   Stored as:
                   activeUserMailToken = "test@gmail.com"
                   ================================================= */

                localStorage.setItem(
                    "activeUserMailToken",
                    emailValue
                );


                /* =================================================
                   ⭐ RESET OLD DASHBOARD PANEL
                   
                   This means a new login starts from the dashboard
                   home instead of the previous user's panel.
                   ================================================= */

                localStorage.removeItem(
                    "stackly_active_panel"
                );


                /* =================================================
                   ROLE BASED REDIRECTION
                ================================================= */

                if (activeSelectedRole === "partner") {

                    window.location.href =
                        "partner-dashboard.html";

                }

                else if (activeSelectedRole === "client") {

                    window.location.href =
                        "client-dashboard.html";

                }

            }
        );


        /* =========================================================
           REMOVE EMAIL ERROR STYLE ON INPUT
        ========================================================= */

        if (emailInput) {

            emailInput.addEventListener(
                "input",
                () => {

                    emailInput.style.borderColor =
                        "rgba(255, 255, 255, 0.05)";

                    emailInput.classList.remove(
                        "input-alert-flash"
                    );

                }
            );

        }


        /* =========================================================
           REMOVE PASSWORD ERROR STYLE ON INPUT
        ========================================================= */

        if (passwordInput) {

            passwordInput.addEventListener(
                "input",
                () => {

                    passwordInput.style.borderColor =
                        "rgba(255, 255, 255, 0.05)";

                    passwordInput.classList.remove(
                        "input-alert-flash"
                    );

                }
            );

        }

    }

});
</script>


</body>
</html>
