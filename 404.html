
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 Route Intercept // Stackly Enterprise Systems</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-portal-body">

    <section class="error-portal-section">
        <div class="portal-grid-mesh"></div>

        <!-- Glassmorphic Terminal Window Component -->
        <div class="terminal-panel-card">
            <div class="error-laser-trim"></div>
            
            <div class="error-vector-icon-box">
                <svg viewBox="0 0 24 24" class="error-svg"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>

            <h1 class="big-code-headline">404</h1>
            <div class="terminal-status-badge">ROUTE_INTERCEPTED // UNKNOWN_URI</div>
            
            <p class="terminal-desc-phrase">
                The targeted system pathway layer is missing or currently isolated. Ensure your navigation specifications match verified staging credentials parameters.
            </p>

            <!-- Twin Action Controls Grid Row -->
            <div class="twin-action-buttons-group">
                <!-- Triggers browser navigation history back path -->
                <button type="button" class="action-control-btn btn-return-back" id="backNavigationBtn" title="Revert to Previous Section Anchor Node">
                    <svg viewBox="0 0 24 24" class="btn-vector-arrow"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Back Node</span>
                </button>
                
                <!-- Links securely to core landing view -->
                <a href="index.html" class="action-control-btn btn-route-home" title="Route to Central Perimeter Landing Page">
                    <span>Home Core</span>
                    <svg viewBox="0 0 24 24" class="btn-vector-arrow"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>
        </div>
    </section>

<style>
    /* ==========================================================================
   1. RESET & FULL-BLEED SYSTEMS CANVAS CONFIGURATIONS
   ========================================================================== */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background-color: #060913;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

:root {
    --bg-deep: #060913;
    --bg-surface: #0a0f1d;
    --neon-cyan: #00f0ff;
    --neon-purple: #9d4edd;
    --text-bright: #ffffff;
    --text-dim: #55657e;
    --accent-error: #ff3366;
}

/* ==========================================================================
   2. GLOBAL PORTAL FRAME & BACKGROUND WIREMESH
   ========================================================================== */
.error-portal-section {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 24px;
}

.portal-grid-mesh {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.005) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none; z-index: 1;
}

/* ==========================================================================
   3. CENTERED GLASSMORPHIC DIAGNOSTIC CORE CARD
   ========================================================================== */
.terminal-panel-card {
    position: relative;
    width: 100%;
    max-width: 560px;
    background-color: var(--bg-surface);
    border: 1px solid rgba(255, 255, 255, 0.02);
    border-radius: 16px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
    z-index: 2;
    animation: consoleEntrance 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.error-laser-trim {
    position: absolute; left: 50%; top: 0; width: 60px; height: 3px; 
    border-radius: 0 0 3px 3px; transform: translateX(-50%);
    background-color: var(--accent-error); box-shadow: 0 0 12px var(--accent-error);
}

.error-vector-icon-box {
    margin-bottom: 24px; display: inline-flex; justify-content: center; align-items: center;
    color: var(--accent-error); animation: beaconPulse 1.8s infinite alternate ease-in-out;
}
.error-svg { width: 56px; height: 56px; fill: none; stroke: currentColor; stroke-width: 1.5; }

.big-code-headline {
    font-size: 6rem; font-weight: 900; margin: 0 0 10px 0; line-height: 1;
    letter-spacing: -2px; font-family: monospace; color: var(--text-bright);
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
}

.terminal-status-badge {
    display: inline-block; font-family: monospace; font-size: 0.75rem; font-weight: 700;
    color: var(--accent-error); background-color: rgba(255, 51, 102, 0.08);
    border: 1px solid rgba(255, 51, 102, 0.15); padding: 4px 12px; border-radius: 4px;
    letter-spacing: 1px; margin-bottom: 24px;
}

.terminal-desc-phrase {
    font-size: 1.05rem; color: var(--text-dim); line-height: 1.6;
    margin: 0 0 35px 0; max-width: 440px; display: inline-block;
}

/* ==========================================================================
   4. FLEXIBLE ACTION CONTROLS & TWIN NEON BUTTONS
   ========================================================================== */
.twin-action-buttons-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    box-sizing: border-box;
}

.action-control-btn {
    padding: 14px 24px;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    box-sizing: border-box;
    white-space: nowrap;
    font-family: inherit;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, background 0.25s ease;
}

.btn-return-back {
    color: var(--text-bright) !important;
    background: rgba(13, 21, 39, 0.5);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
}
.btn-return-back:hover {
    background-color: var(--neon-cyan);
    color: #060913 !important;
    box-shadow: 0 8px 25px rgba(0, 240, 255, 0.35);
    transform: translateY(-2px);
}

.btn-route-home {
    color: var(--text-bright) !important;
    background: rgba(13, 21, 39, 0.5);
    border: 1px solid var(--neon-purple);
    box-shadow: 0 0 15px rgba(157, 78, 221, 0.1);
}
.btn-route-home:hover {
    background-color: var(--neon-purple);
    color: var(--text-bright) !important;
    box-shadow: 0 8px 25px rgba(157, 78, 221, 0.35);
    transform: translateY(-2px);
}

.btn-vector-arrow { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; transition: transform 0.25s ease; }
.btn-return-back:hover .btn-vector-arrow { transform: translateX(-3px); }
.btn-route-home:hover .btn-vector-arrow { transform: scale(1.05); }

/* ==========================================================================
   5. HARDWARE-ACCELERATED TIME RUNTIME KEYFRAMES
   ========================================================================== */
@keyframes consoleEntrance { 0% { opacity: 0; transform: scale(0.97) translateY(12px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes beaconPulse { 0% { opacity: 0.7; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 6px var(--accent-error)); } }

/* ==========================================================================
   6. FLUID RESPONSIVE VIEWPORT CONSTRAINTS
   ========================================================================== */
@media (max-width: 580px) {
    .terminal-panel-card { padding: 40px 24px; border-radius: 12px; }
    .big-code-headline { font-size: 4.5rem; }
    .terminal-desc-phrase { font-size: 0.95rem; margin-bottom: 30px; }
    .twin-action-buttons-group { grid-template-columns: 1fr; gap: 12px; }
    .action-control-btn { width: 100%; border-radius: 8px; }
}

</style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    
    // BACK NODE NAVIGATION INTERACTION
    const backNavigationBtn = document.getElementById("backNavigationBtn");

    if (backNavigationBtn) {
        backNavigationBtn.addEventListener("click", (event) => {
            event.preventDefault();
            
            // Reverts the browser frame directly back to the exact previous section
            if (document.referrer) {
                window.history.back();
            } else {
                // Secure fallback routing target if historical stack array is empty
                window.location.href = "index.html";
            }
        });
    }
});

</script>
</body>
</html>
