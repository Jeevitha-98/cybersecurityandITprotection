<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registration Gateway // Stackly Systems</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-portal-body">

    <section class="login-portal-section">
        <!-- Technical backdrop micro-grid lines -->
        <div class="portal-grid-backdrop"></div>

        <div class="portal-split-container">
            
            <!-- ==========================================
               LEFT COLUMN - SATELLITE RADAR HUD SCOPE
            ========================================== -->
            <div class="portal-left-visual">
                <div class="vector-hud-scope">
                    <svg class="hud-matrix-svg" viewBox="0 0 220 220" xmlns="http://w3.org">
                        <defs>
                            <linearGradient id="beamGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="rgba(0, 240, 255, 0.18)" stop-opacity="1"/>
                                <stop offset="60%" stop-color="rgba(157, 78, 221, 0.03)" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        <circle cx="110" cy="110" r="95" fill="none" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1" />
                        <circle cx="110" cy="110" r="70" fill="none" stroke="#9d4edd" stroke-width="1" stroke-dasharray="6, 4" class="radar-inner-ring" />
                        <circle cx="110" cy="110" r="45" fill="none" stroke="#00f0ff" stroke-width="1.5" />
                        <circle cx="110" cy="110" r="6" fill="#ffffff" />
                        
                        <g class="satellite-orbit-group">
                            <ellipse cx="110" cy="110" rx="80" ry="25" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" transform="rotate(-30 110 110)" />
                            <circle cx="40" cy="70" r="4.5" fill="#00f0ff" class="radar-ping-dot" />
                            <circle cx="180" cy="150" r="4.5" fill="#9d4edd" class="radar-ping-dot" />
                        </g>
                        <path d="M110,110 L220,110 A110,110 0 0,1 110,220 Z" fill="url(#beamGlow)" class="radar-sweep-beam-path"/>
                    </svg>
                    <div class="hud-telemetry-chip chip-top">REGISTRATION // HUB</div>
                    <div class="hud-telemetry-chip chip-bottom">PROFILES // DECRYPTED</div>
                </div>
            </div>

            <!-- ==========================================
               RIGHT COLUMN - SECURE SIGNUP CARD
            ========================================== -->
            <div class="portal-right-card-panel">
                <div class="secure-auth-card">
                    
                    <!-- Back to Log In Link -->
                    <div class="card-top-nav-row">
                        <a href="login.html" class="home-nav-pill">← Back to Log In</a>
                    </div>

                    <h1 class="portal-main-title">CREATE ACCOUNT</h1>
                    <p class="portal-subtitle">Register your organizational profile to open your project registry deck.</p>

                    <form id="secureSignupForm" novalidate>
                        
                        <!-- Input: Operator Full Name -->
                        <div class="console-input-group">
                            <label for="inputFullName">FULL NAME</label>
                            <input type="text" id="inputFullName" class="portal-console-input" placeholder="Enter your full name" autocomplete="off">
                        </div>

                        <!-- Input: Secure Email Address -->
                        <div class="console-input-group">
                            <label for="inputEmail">EMAIL ADDRESS</label>
                            <input type="email" id="inputEmail" class="portal-console-input" placeholder="you@example.com" autocomplete="off">
                        </div>

                        <!-- Input: Original Password Token -->
                        <div class="console-input-group">
                            <label for="inputPassword">PASSWORD</label>
                            <div class="password-field-wrapper">
                                <input type="password" id="inputPassword" class="portal-console-input" placeholder="********" autocomplete="off">
                                <button type="button" class="password-toggle-peek" id="passwordVisToggle" aria-label="Toggle visibility">
                                    <svg viewBox="0 0 24 24" class="peek-svg"><path d="M1 12s4-8 11-8 4 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>

                        <!-- Input: Password Confirmation Match Field -->
                        <div class="console-input-group">
                            <label for="inputConfirmPassword">CONFIRM PASSWORD</label>
                            <div class="password-field-wrapper">
                                <input type="password" id="inputConfirmPassword" class="portal-console-input" placeholder="********" autocomplete="off">
                                <button type="button" class="password-toggle-peek" id="confirmPasswordVisToggle" aria-label="Toggle visibility">
                                    <svg viewBox="0 0 24 24" class="peek-svg"><path d="M1 12s4-8 11-8 4 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>

                        <!-- Access Account Initialization Action Button -->
                        <button type="submit" class="secure-login-submit-btn">
                            <span>SIGN UP →</span>
                        </button>

                        <!-- Already have an account row -->
                        <div class="portal-form-footer" style="margin-top: 30px;">
                            <span>Already have an account? <a href="login.html" class="signup-redirect-anchor">Log In</a></span>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </section>

<style>
    /* ==========================================
   RESET MARGINS & FORCE 100% CANVAS BOUNDS
========================================== */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background-color: #060913;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
}

.fullscreen-portal-body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
}

:root {
    --bg-deep: #060913;
    --bg-surface: #0a0f1d;
    --neon-cyan: #00f0ff;
    --neon-purple: #9d4edd;
    --text-bright: #ffffff;
    --text-dim: #55657e;
    --accent-error: #ff3366;
}

/* ==========================================
   PROPORTIONAL FULL VIEWPORT SPLIT PANEL
========================================== */
.login-portal-section {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0;
}

.portal-grid-backdrop {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.005) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none; z-index: 1;
}

.portal-split-container {
    position: relative;
    width: 100%;
    max-width: 1340px;
    margin: 0 auto;
    padding: 0 40px;
    display: grid;
    grid-template-columns: 0.95fr 1.05fr;
    gap: 60px;
    align-items: center;
    z-index: 2;
}

/* ==========================================
   LEFT ZONE - CONTINUOUS MONITORING SONAR
========================================== */
.portal-left-visual {
    width: 100%; display: flex; justify-content: center; align-items: center;
}

.vector-hud-scope {
    position: relative; width: 100%; max-width: 380px;
    aspect-ratio: 1 / 1; background: rgba(13, 21, 39, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.02); border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
}

.hud-matrix-svg { width: 100%; height: auto; display: block; }
.radar-sweep-beam-path { transform-origin: 110px 110px; animation: loopSweep 4s linear infinite; }
.radar-inner-ring { transform-origin: 110px 110px; animation: loopSweep 16s linear infinite reverse; }
.radar-ping-dot { animation: pulseDot 1.5s infinite ease-in-out; transform-origin: center; }

.hud-telemetry-chip {
    position: absolute; font-family: monospace; font-size: 0.65rem; color: var(--text-dim);
    letter-spacing: 1px; background-color: var(--bg-deep); padding: 2px 8px;
    border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 4px;
}
.chip-top { top: -6px; } .chip-bottom { bottom: -6px; }

/* ==========================================
   RIGHT ZONE - SECURE REPLICATED AUTH CARD
========================================== */
.portal-right-card-panel {
    width: 100%; display: flex; justify-content: flex-end;
}

.secure-auth-card {
    width: 100%; max-width: 500px;
    background-color: var(--bg-surface);
    border: 1px solid rgba(255, 255, 255, 0.02);
    border-radius: 16px; padding: 40px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    box-sizing: border-box;
}

.card-top-nav-row {
    width: 100%; display: flex; justify-content: flex-end; margin-bottom: 20px;
}

.home-nav-pill {
    padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700;
    text-decoration: none; color: #03060c; background-color: var(--text-bright);
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    transition: transform 0.2s, box-shadow 0.2s;
}
.home-nav-pill:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25); }

.portal-main-title {
    font-size: 2.5rem; font-weight: 900; color: var(--text-bright);
    letter-spacing: -0.5px; margin: 0 0 10px 0; text-transform: uppercase; text-align: left;
}

.portal-subtitle {
    font-size: 1.05rem; color: #55657e; line-height: 1.5; text-align: left; margin: 0 0 35px 0;
}

.console-input-group {
    display: flex; flex-direction: column; align-items: flex-start; width: 100%; margin-bottom: 24px;
}
.console-input-group label {
    font-family: monospace; font-size: 0.75rem; font-weight: 700; color: var(--text-dim); letter-spacing: 1.5px; margin-bottom: 10px;
}

.portal-console-input {
    width: 100%; padding: 15px 18px;
    background-color: rgba(6, 9, 19, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px;
    color: var(--text-bright); font-size: 1.05rem; box-sizing: border-box;
    transition: border-color 0.25s, box-shadow 0.25s;
}
.portal-console-input:focus { outline: none; border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 8px rgba(0, 240, 255, 0.15); }

/* ==========================================
   PASSWORD POSITION EYE FIXED WRAPPER
========================================== */
.password-field-wrapper { 
    width: 100%; 
    position: relative; 
    display: block;
    box-sizing: border-box;
}

/* Reserves space on the right edge so long security keys never text-bleed into the icon */
.password-field-wrapper .portal-console-input { 
    padding-right: 54px !important; 
}

.password-toggle-peek {
    position: absolute; 
    /* Hard locks the eye button container inside the inner right perimeter bounds */
    right: 16px; 
    top: 50%; 
    transform: translateY(-50%);
    background: none !important; 
    border: none !important; 
    cursor: pointer; 
    padding: 4px !important; 
    margin: 0 !important;
    display: inline-flex; 
    align-items: center;
    justify-content: center;
    z-index: 5;
}
.peek-svg { width: 18px; height: 18px; fill: none; stroke: var(--text-dim); stroke-width: 2.2; transition: stroke 0.2s; pointer-events: none; }
.password-toggle-peek:hover .peek-svg { stroke: var(--text-bright); filter: drop-shadow(0 0 4px var(--neon-cyan)); }
.password-toggle-peek.revealing-peek .peek-svg { stroke: var(--neon-cyan); filter: drop-shadow(0 0 6px var(--neon-cyan)); }

.secure-login-submit-btn {
    width: 100%; padding: 15px; border-radius: 25px; border: none;
    background: linear-gradient(90deg, #1fa2ff, #12c2e9, #00f0ff);
    color: #03060c; font-size: 0.95rem; font-weight: 800; letter-spacing: 0.5px;
    cursor: pointer; box-shadow: 0 6px 25px rgba(0, 240, 255, 0.35);
    transition: transform 0.2s, box-shadow 0.3s;
    margin-top: 10px;
}
.secure-login-submit-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0, 240, 255, 0.5); }

.portal-form-footer { width: 100%; text-align: center; }
.portal-form-footer span { font-size: 0.9rem; color: #55657e; }
.signup-redirect-anchor { font-weight: 700; color: var(--text-bright); text-decoration: none; }
.signup-redirect-anchor:hover { text-decoration: underline; color: var(--neon-cyan); }

.input-alert-flash { animation: perimeterErrorFlash 0.3s ease infinite alternate; }

@keyframes loopSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }
@keyframes perimeterErrorFlash { 0% { box-shadow: 0 0 4px rgba(255, 51, 102, 0.2); border-color: rgba(255, 51, 102, 0.4); } 100% { box-shadow: 0 0 10px rgba(255, 51, 102, 0.6); border-color: var(--accent-error); } }

/* ==========================================
   FLUID RESPONSIVE VIEWPORT CONSTRAINTS
========================================== */
@media (max-width: 992px) {
    .portal-split-container { grid-template-columns: 1fr; gap: 40px; padding: 0 24px; }
    .portal-left-visual { display: none; } 
    .portal-right-card-panel { justify-content: center; }
    .secure-auth-card { max-width: 100%; }
}

@media (max-width: 480px) {
    .portal-split-container { padding: 0 16px; }
    .secure-auth-card { padding: 30px 16px; }
    .portal-main-title { font-size: 1.85rem; }
    .secure-login-submit-btn { border-radius: 8px; }
}

</style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    
    const signupForm = document.getElementById("secureSignupForm");
    const nameInput = document.getElementById("inputFullName");
    const emailInput = document.getElementById("inputEmail");
    const passwordInput = document.getElementById("inputPassword");
    const confirmPasswordInput = document.getElementById("inputConfirmPassword");
    
    const passwordVisToggle = document.getElementById("passwordVisToggle");
    const confirmPasswordVisToggle = document.getElementById("confirmPasswordVisToggle");

    // 1. DUAL TOGGLE BINDING: Swaps type variables and maps the active glow class
    function setupVisibilityToggler(toggleNode, fieldNode) {
        if (toggleNode && fieldNode) {
            toggleNode.addEventListener("click", (event) => {
                event.preventDefault(); // Prevents layout form bubbling triggers
                
                const isMaskedType = fieldNode.getAttribute("type") === "password";
                fieldNode.setAttribute("type", isMaskedType ? "text" : "password");
                
                if (isMaskedType) {
                    toggleNode.classList.add("revealing-peek");
                } else {
                    toggleNode.classList.remove("revealing-peek");
                }
            });
        }
    }

    // Instantiate toggles across fields independently to maintain focus targets
    setupVisibilityToggler(passwordVisToggle, passwordInput);
    setupVisibilityToggler(confirmPasswordVisToggle, confirmPasswordInput);

    // 2. DATA TRANSMISSION INPUT VALIDATORS
    if (signupForm) {
        signupForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const inputCollection = [nameInput, emailInput, passwordInput, confirmPasswordInput];
            let allFieldsPopulated = true;

            // Empty field verification scan
            inputCollection.forEach(node => {
                if (!node.value.trim()) {
                    allFieldsPopulated = false;
                    node.style.borderColor = "var(--accent-error)";
                    node.classList.add("input-alert-flash");
                }
            });

            if (!allFieldsPopulated) {
                alert("ACCESS DENIED: Please fill the required fields before submitting sign up logs.");
                return;
            }

            // Cryptographic confirmation match validator checks
            if (passwordInput.value !== confirmPasswordInput.value) {
                confirmPasswordInput.style.borderColor = "var(--accent-error)";
                confirmPasswordInput.classList.add("input-alert-flash");
                alert("CRITICAL VALIDATION ERROR: Password confirmation string does not match the original token key.");
                return;
            }

            alert("SUCCESS: Successfully signed up. Welcome to the console node.");
            window.location.href = "login.html";
        });

        // Strip alert notification frames instantly upon subsequent key input adaptations
        [nameInput, emailInput, passwordInput, confirmPasswordInput].forEach(node => {
            if (node) {
                node.addEventListener("input", () => {
                    node.style.borderColor = "rgba(255, 255, 255, 0.05)";
                    node.classList.remove("input-alert-flash");
                });
            }
        });
    }
});

</script>
</body>
</html>
